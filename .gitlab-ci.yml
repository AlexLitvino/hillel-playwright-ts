stages:
  - test
  - deploy

playwright_tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  variables:
    CI: "true"
  script:
    - npm ci
    - npx playwright test --project=e2e
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/

pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: playwright_tests
      artifacts: true
  script:
    - mkdir -p public
    - cp -r playwright-report/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
